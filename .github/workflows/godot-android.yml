# Сборка APK без Unity: Godot 4 + Android SDK прямо на runner'е.
# Никаких секретов не требуется — keystore отладочный и генерируется в этом же job'е.
name: Build Android APK (Godot)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  # нужно, чтобы при падении сборки запостить лог ошибок комментарием в PR
  pull-requests: write

concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3.0
  EXPORT_PRESET: Android
  PROJECT_PATH: godot

jobs:
  screenshots:
    name: Render model screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Отдельная задача: картинки нужны для проверки внешнего вида и не должны
    # ронять сборку APK.
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Install xvfb and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglx-mesa0 libegl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2 || true

      - name: Import project
        run: godot --headless --path "$PROJECT_PATH" --import || true

      - name: Render screenshots
        run: |
          export SHOT_DIR="$GITHUB_WORKSPACE/shots"
          xvfb-run -a -s "-screen 0 1600x900x24" \
            godot --path "$PROJECT_PATH" --rendering-driver opengl3 \
            --rendering-method gl_compatibility --resolution 1280x720 -- --shot 2>&1 | tee /tmp/shot.log || true
          grep -E "SHOT|ERROR|SCRIPT" /tmp/shot.log | head -40
          ls -la "$SHOT_DIR" || true
          test -n "$(ls -A "$SHOT_DIR" 2>/dev/null)"

      - name: Publish the screenshots branch
        run: |
          mkdir -p screenshots
          cp "$GITHUB_WORKSPACE"/shots/*.png screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan shots
          git rm -rf --cached . > /dev/null
          git add -f screenshots
          git commit -q -m "screenshots: ${GITHUB_SHA}"
          git push --force origin shots:ci-screenshots
          echo "Скриншоты: https://github.com/$GITHUB_REPOSITORY/tree/ci-screenshots/screenshots"

  build:
    name: Build APK (Godot 4.3 · Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Check Godot
        run: godot --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже предустановлен на ubuntu-latest, отдельный setup-action
      # не нужен (android-actions/setup-android падал на этом runner'е).
      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK" -name sdkmanager -type f | head -1)"; fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          ls "$SDK/build-tools" "$SDK/platforms"

      - name: Generate debug keystore
        run: |
          rm -f /tmp/debug.keystore
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey -keypass android \
            -keystore /tmp/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Point Godot editor settings at the SDK/JDK
        run: |
          mkdir -p "$HOME/.config/godot"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
          } > "$SETTINGS"
          cat "$SETTINGS"

      - name: Import project resources
        run: godot --headless --path "$PROJECT_PATH" --import || true

      - name: Check every GDScript file
        run: |
          set +e
          failed=0
          : > /tmp/report.md
          echo "### Ошибки GDScript" >> /tmp/report.md
          echo '```' >> /tmp/report.md
          while IFS= read -r file; do
            rel="${file#$PROJECT_PATH/}"
            out=$(godot --headless --path "$PROJECT_PATH" --check-only --script "res://$rel" 2>&1)
            code=$?
            if [ "$code" -ne 0 ]; then
              failed=1
              printf '\n--- %s\n%s\n' "$rel" "$out" >> /tmp/report.md
              printf '\n--- %s\n%s\n' "$rel" "$out"
            fi
          done < <(find "$PROJECT_PATH/scripts" -name '*.gd' | sort)
          echo '```' >> /tmp/report.md
          if [ "$failed" -ne 0 ]; then
            echo "Есть ошибки — см. /tmp/report.md"
            exit 1
          fi
          echo "Все скрипты разобраны без ошибок"

      - name: Smoke run (автопилот проезжает заезд)
        run: |
          timeout 180 godot --headless --path "$PROJECT_PATH" --fixed-fps 60 -- --smoke 2>&1 | tee /tmp/run.log
          status=0
          if ! grep -q "SMOKE OK" /tmp/run.log; then
            echo "::error::Автотест не дошёл до конца заезда"
            status=1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error|Invalid call|Cannot call method|Nonexistent function|Invalid access" /tmp/run.log; then
            echo "::error::Ошибка в рантайме, смотрите лог выше"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            {
              echo "### Ошибки при запуске игры"
              echo '```'
              grep -nE "SMOKE|SCRIPT ERROR|Parse Error|Invalid call|Cannot call method|Nonexistent function|Invalid access|at: " /tmp/run.log | head -80
              echo '```'
            } > /tmp/report.md
          fi
          exit $status

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path "$PROJECT_PATH" --export-debug "$EXPORT_PRESET" "$GITHUB_WORKSPACE/build/KugooFreeride.apk"

      - name: Report smoke numbers in the pull request
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Автотест заезда"
            echo '```'
            grep -E "SMOKE" /tmp/run.log || echo "нет строк SMOKE"
            echo '```'
          } > /tmp/smoke.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/smoke.md

      - name: Report failure in the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/report.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/report.md
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KugooFreeride-apk
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30

      # На main дополнительно публикуем APK в Releases: оттуда файл
      # скачивается с телефона одной ссылкой, без распаковки архива.
      - name: Publish an APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" build/KugooFreeride.apk \
            --title "Kugoo Freeride APK $tag" \
            --notes "Автоматическая сборка из коммита $GITHUB_SHA. Android 7+ (arm64), отладочная подпись. Скачайте KugooFreeride.apk и установите на телефон."
          echo "Релиз: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"

