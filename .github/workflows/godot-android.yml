# Сборка APK без Unity: Godot 4 + Android SDK прямо на runner'е.
# Никаких секретов не требуется — keystore отладочный и генерируется в этом же job'е.
name: Build Android APK (Godot)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # нужно, чтобы при падении сборки запостить лог ошибок комментарием в PR
  pull-requests: write

concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3.0
  EXPORT_PRESET: Android
  PROJECT_PATH: godot

jobs:
  build:
    name: Build APK (Godot 4.3 · Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Check Godot
        run: godot --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже предустановлен на ubuntu-latest, отдельный setup-action
      # не нужен (android-actions/setup-android падал на этом runner'е).
      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK" -name sdkmanager -type f | head -1)"; fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          ls "$SDK/build-tools" "$SDK/platforms"

      - name: Generate debug keystore
        run: |
          rm -f /tmp/debug.keystore
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey -keypass android \
            -keystore /tmp/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Point Godot editor settings at the SDK/JDK
        run: |
          mkdir -p "$HOME/.config/godot"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
          } > "$SETTINGS"
          cat "$SETTINGS"

      - name: Import project resources
        run: godot --headless --path "$PROJECT_PATH" --import || true

      - name: Check every GDScript file
        run: |
          set +e
          failed=0
          : > /tmp/report.md
          echo "### Ошибки GDScript" >> /tmp/report.md
          echo '```' >> /tmp/report.md
          while IFS= read -r file; do
            rel="${file#$PROJECT_PATH/}"
            out=$(godot --headless --path "$PROJECT_PATH" --check-only --script "res://$rel" 2>&1)
            code=$?
            if [ "$code" -ne 0 ]; then
              failed=1
              printf '\n--- %s\n%s\n' "$rel" "$out" >> /tmp/report.md
              printf '\n--- %s\n%s\n' "$rel" "$out"
            fi
          done < <(find "$PROJECT_PATH/scripts" -name '*.gd' | sort)
          echo '```' >> /tmp/report.md
          if [ "$failed" -ne 0 ]; then
            echo "Есть ошибки — см. /tmp/report.md"
            exit 1
          fi
          echo "Все скрипты разобраны без ошибок"

      - name: Smoke run (3 seconds of headless gameplay)
        run: |
          timeout 40 godot --headless --path "$PROJECT_PATH" --quit-after 240 2>&1 | tee /tmp/run.log
          if grep -qE "SCRIPT ERROR|Parse Error|Invalid call|Cannot call method|Nonexistent function" /tmp/run.log; then
            {
              echo "### Ошибки при запуске игры"
              echo '```'
              grep -nE "SCRIPT ERROR|Parse Error|Invalid call|Cannot call method|Nonexistent function|at: " /tmp/run.log | head -60
              echo '```'
            } > /tmp/report.md
            echo "::error::Ошибка в рантайме, смотрите лог выше"
            exit 1
          fi

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path "$PROJECT_PATH" --export-debug "$EXPORT_PRESET" "$GITHUB_WORKSPACE/build/KugooFreeride.apk"

      - name: Report failure in the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/report.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/report.md
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KugooFreeride-apk
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30
